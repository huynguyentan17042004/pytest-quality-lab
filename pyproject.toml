[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-quality-lab"
version = "0.2.0"
description = "QA automation framework with API, Selenium UI, property testing and quality analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pytest>=8,<10",
  "requests>=2.31,<3",
  "selenium>=4.20,<5",
  "jsonschema>=4.20,<5",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
report = ["pytest-html>=4.1,<5"]
allure = ["allure-pytest>=2.16,<3"]
dev = ["pytest-html>=4.1,<5", "hypothesis>=6.169,<7", "ruff>=0.8,<1", "mypy>=1.13,<2", "types-requests", "types-PyYAML"]

[project.scripts]
qa-dashboard = "qa_framework.analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
  "framework: self-tests of framework components",
  "unit: deterministic tests without external I/O",
  "integration: multiple components working together locally",
  "api: API test layer",
  "ui: browser UI test layer",
  "smoke: small confidence suite",
  "regression: regression suite",
  "critical: business-critical scenario",
  "negative: negative scenario",
  "demo: live integration demonstration",
  "external: requires explicit --run-external opt-in",
  "serial: must run in a separate non-parallel job",
  "property: property-based test generated by Hypothesis",
  "requirement(id): requirement identifier used for coverage analytics",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
packages = ["qa_framework"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
