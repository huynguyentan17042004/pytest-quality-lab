<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pytest Quality Lab · Local Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font: 16px/1.45 system-ui, sans-serif;
      color: #18212f;
      background: linear-gradient(135deg, #edf4ff, #f8fafc 55%, #eefbf7);
    }
    main {
      width: min(420px, calc(100% - 40px));
      padding: 36px;
      border: 1px solid #e3eaf4;
      border-radius: 18px;
      background: white;
      box-shadow: 0 24px 60px #19345e1c;
    }
    .eyebrow { margin: 0 0 8px; color: #2876e8; font-size: 13px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .intro { margin: 0 0 26px; color: #617087; }
    label { display: block; margin: 16px 0 7px; font-size: 14px; font-weight: 650; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccd7e7;
      border-radius: 9px;
      font: inherit;
      outline: none;
    }
    input:focus { border-color: #2876e8; box-shadow: 0 0 0 3px #2876e822; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      border: 0;
      border-radius: 9px;
      color: white;
      background: #2876e8;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    #message { margin: 18px 0 0; padding: 11px; border-radius: 8px; background: #edf8f3; color: #167050; }
    .hint { margin: 20px 0 0; color: #8390a3; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Pytest Quality Lab</p>
    <h1>Controlled login demo</h1>
    <p class="intro">A deterministic local fixture for Selenium Page Object tests.</p>
    <label for="username">Username</label>
    <input id="username" autocomplete="username" placeholder="Enter local_user">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Enter any value">
    <button id="login" onclick="login()">Sign in</button>
    <p id="message" hidden></p>
    <p class="hint">Local-only · No network request is sent</p>
  </main>
  <script>
    function login() {
      setTimeout(() => {
        const message = document.getElementById('message');
        message.textContent = document.getElementById('username').value === 'local_user' ? 'Welcome' : 'Invalid credentials';
        message.hidden = false;
      }, 100);
    }
  </script>
</body>
</html>
